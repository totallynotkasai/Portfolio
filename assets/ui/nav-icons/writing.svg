<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E">
  <!-- Nav icon — Writing: pencil, drawn upright then tilted.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/writing.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Outlines are currentColor (navy here; blush on the active nav pill). Fills are the
       flat brand hexes from style.css — update both if the palette changes. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(45 12 12)">
      <path fill="#FB9DC4" d="M9 5V4.3A2.3 2.3 0 0 1 11.3 2h1.4A2.3 2.3 0 0 1 15 4.3V5z"/>
      <rect fill="#FFFFFF" x="9" y="5" width="6" height="2.2"/>
      <rect fill="#5AC8B6" x="9" y="7.2" width="6" height="9.8"/>
      <path fill="#F6D9B0" d="M9 17l3 5 3-5z"/>
      <path d="M11 20.3l1 1.7 1-1.7z" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
  <use href="#icon"/>
</svg>
