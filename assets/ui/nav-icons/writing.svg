<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E" stroke-width="1.8">
  <!-- Nav icon - Writing: pencil, drawn upright then tilted.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/writing.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Two colours only: outlines and details are currentColor (navy), the fill
       is the page's flat chip colour from style.css. Update both if the palette changes.
       Line thickness comes from the page (style.css), so it matches the windows. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- The squiggle it writes on the desktop; hidden until then. -->
    <path class="ic-scribble" fill="none" opacity="0" pathLength="1" d="M2.5 20.2q1.25-1.2 2.5 0t2.5 0"/>
    <g class="ic-pencil">
      <g transform="rotate(45 12 12)">
        <rect vector-effect="non-scaling-stroke" fill="#5AC8B6" x="9" y="3" width="6" height="14"/>
        <path vector-effect="non-scaling-stroke" fill="#5AC8B6" d="M9 17l3 5 3-5z"/>
        <path d="M11 20.3l1 1.7 1-1.7z" fill="currentColor" stroke="none"/>
      </g>
    </g>
  </symbol>
  <use href="#icon"/>
</svg>
