<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E" stroke-width="1.8">
  <!-- Nav icon - Art: paint palette with four paint wells.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/art.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Two colours only: outlines and details are currentColor (navy), the fill
       is the page's flat chip colour from style.css. Update both if the palette changes.
       Line thickness comes from the page (style.css), so it matches the windows. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path vector-effect="non-scaling-stroke" fill="#AE9DF3"
          d="M12 2.8C6.6 2.8 2.5 6.8 2.5 12s4.1 9.2 9.2 9.2c1.5 0 2.3-.9 2.3-2 0-1.3-1-1.7-1-3 0-1.2 1-2 2.2-2h2.6c2.4 0 3.7-1.6 3.7-3.9 0-4.1-4.2-7.5-9.5-7.5z"/>
    <circle class="ic-dot" cx="7.4" cy="11.6" r="1.4" fill="currentColor" stroke="none"/>
    <circle class="ic-dot" cx="9.2" cy="7.2" r="1.4" fill="currentColor" stroke="none"/>
    <circle class="ic-dot" cx="14.2" cy="6.6" r="1.4" fill="currentColor" stroke="none"/>
    <circle class="ic-dot" cx="17.8" cy="9.8" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>
  <use href="#icon"/>
</svg>
