<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E">
  <!-- Nav icon — Art: paint palette with blobs of the other page colours.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/art.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Outlines are currentColor (navy here; blush on the active nav pill). Fills are the
       flat brand hexes from style.css — update both if the palette changes. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#AE9DF3"
          d="M12 2.8C6.6 2.8 2.5 6.8 2.5 12s4.1 9.2 9.2 9.2c1.5 0 2.3-.9 2.3-2 0-1.3-1-1.7-1-3 0-1.2 1-2 2.2-2h2.6c2.4 0 3.7-1.6 3.7-3.9 0-4.1-4.2-7.5-9.5-7.5z"/>
    <circle fill="#FEDA74" cx="7.4" cy="11.6" r="1.6" stroke-width="1.3"/>
    <circle fill="#FB9DC4"   cx="9.2" cy="7.2"  r="1.6" stroke-width="1.3"/>
    <circle fill="#5AC8B6"   cx="14.2" cy="6.6" r="1.6" stroke-width="1.3"/>
    <circle fill="#65A1FB"   cx="17.8" cy="9.8" r="1.6" stroke-width="1.3"/>
  </symbol>
  <use href="#icon"/>
</svg>
