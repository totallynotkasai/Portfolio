<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E" stroke-width="1.8">
  <!-- Nav icon - Trash: a bin with its lid slightly open.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/trash.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Two colours only: outlines are currentColor (navy), the fill is the
       flat grey from style.css. Update both if the palette changes.
       Line thickness comes from the page (style.css), so it matches the windows. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#C5C8D6" vector-effect="non-scaling-stroke" d="M5.5 8.5h13l-1.3 12.2a1.6 1.6 0 0 1-1.6 1.4H8.4a1.6 1.6 0 0 1-1.6-1.4z"/>
    <path fill="#C5C8D6" vector-effect="non-scaling-stroke" d="M4.2 6.8l14.6-2.6.4 2.1-14.6 2.6z"/>
    <path fill="none" vector-effect="non-scaling-stroke" d="M10.1 4.9l3.6-.6M10 12v6.5M14 12v6.5"/>
  </symbol>
  <use href="#icon"/>
</svg>
