<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" color="#161A2E" stroke-width="1.8">
  <!-- Nav icon - About: speech bubble.
       The site uses the <symbol> below via <use href="/assets/ui/nav-icons/about.svg#icon">;
       the <use> at the bottom just draws it when you open this file on its own.
       Outlines are currentColor (navy). Fills are the
       flat brand hexes from style.css - update both if the palette changes.
       Line thickness comes from the page (style.css), so it matches the windows. -->
  <symbol id="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path vector-effect="non-scaling-stroke" fill="#FEDA74"
          d="M5.5 3.5h13a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7.5l-4.5 3.8v-3.8h-1a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z"/>
    <circle class="ic-dot" cx="8" cy="10.5" r="1.25" fill="currentColor" stroke="none"/>
    <circle class="ic-dot" cx="12" cy="10.5" r="1.25" fill="currentColor" stroke="none"/>
    <circle class="ic-dot" cx="16" cy="10.5" r="1.25" fill="currentColor" stroke="none"/>
  </symbol>
  <use href="#icon"/>
</svg>
